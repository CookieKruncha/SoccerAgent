      .map(([reason, count]) => `${count} ${escapeHtml(reason).replace(/_/g, " ")}`)
      .join(", ");
    rows.push(row("rejected", `<span class="warn">${run.rejected}</span> ` +
      `<span class="off">${reasons}</span>`));
  }
  rows.push(row("won ball", String(run.turnovers)));
  rows.push(row("at feet", `${fixed(run.controlTicks / hz)} s`));
  if (run.goals) rows.push(row("goals", `<span class="on">${run.goals}</span>`));
  if (run.ownGoals) rows.push(row("own goals", `<span class="warn">${run.ownGoals}</span>`));
  if (run.fouls) {
    rows.push(row("fouls", `<span class="warn">${run.fouls}</span> ` +
      `<span class="off">kickoff encroachment</span>`));
  }

  const html = rows.join("");
  if (html !== lastInspectorHtml) {
    inspectorBodyEl.innerHTML = html;
    inspectorEl.classList.remove("hidden");
    lastInspectorHtml = html;
    requestAnimationFrame(() => positionFloatingInspector());
  }
}

const mix = (a, b, t) => a + (b - a) * t;
const mixVec = (a, b, t) => ({ x: mix(a.x, b.x, t), y: mix(a.y, b.y, t) });

/** Blends two snapshots for display. Discrete state comes from the earlier one. */
function blend(current, next, t) {
  if (!next || t <= 0) return current;
  return {
    ...current,
    ball_position: mixVec(current.ball_position, next.ball_position, t),
    ball_velocity: mixVec(current.ball_velocity, next.ball_velocity, t),
    ball_height: mix(current.ball_height ?? 0, next.ball_height ?? 0, t),
    ball_vertical_velocity: current.ball_vertical_velocity ?? 0,
    players: current.players.map((player, index) => {
      const other = next.players[index];
      if (!other) return player;
      return {
        ...player,
        position: mixVec(player.position, other.position, t),
        velocity: mixVec(player.velocity, other.velocity, t),
        facing: mixVec(player.facing, other.facing, t),
      };
    }),
  };
}

function render() {
  ctx.clearRect(0, 0, viewport.w, viewport.h);
  if (!config) return;
  computeProjection();
  drawField();

  const index = Math.min(Math.floor(position), frames.length - 1);
  const entry = frames[index];
  if (!entry) return;
  const next = frames[index + 1];
  // Overlays, roles and the panels stay on the authoritative frame; only the
  // bodies are smoothed.
  const drawn = blend(entry.frame, next?.frame, position - index);

  // Under everything: it is a shading of the grass, not a mark on it.
  drawHeatmap(entry, drawn);
  drawDebug(entry, drawn);
  drawTrajectory(drawn);
  // Under the bodies, so a player is never hidden by their own intentions.
  drawReasoning(entry, drawn);
  drawIntent(entry, drawn, index);
  drawPlayers(entry, drawn);
  drawBall(drawn);
  updateScoreboard(entry, index);
  updateDiagnostics(entry);
  updateEventLog(index);
  updateInspector(entry, index);
}

// ---------------------------------------------------------------------------
// Playback
// ---------------------------------------------------------------------------

function tick(now) {
  const delta = Math.min((now - lastTime) / 1000, 0.25);
  lastTime = now;

  if (live && now - lastPoll > 200) {
    lastPoll = now;
    pollLive().catch(() => {});
  }

  const hz = config?.match?.simulation_hz ?? 20;
  const newest = Math.max(frames.length - 1, 0);

  if (live && following && frames.length) {
    // Advance smoothly at the rate frames are arriving rather than jumping to
    // the newest one each poll - polling every 200 ms would otherwise move the
    // picture five times a second.
    let advance = delta * hz * speed;
    const behind = newest - position;
    // If the stream has run ahead (a slow tab, a hitch), close the gap rather
    // than drifting further behind for the rest of the match.
    if (behind > hz * 1.5) advance += behind - hz * 1.5;
    position = Math.min(position + advance, newest);
  } else if (playing && frames.length > 1) {
    position += delta * hz * speed;
    if (position >= newest) {
      position = newest;
      if (!live) { playing = false; playEl.textContent = "Play"; }
    }
  }

  const scrub = Math.round(position);
  if (scrub !== lastScrub) {
    scrubEl.value = String(scrub);
    lastScrub = scrub;
  }
  render();
  requestAnimationFrame(tick);
}

playEl.addEventListener("click", () => {
  playing = !playing;
  playEl.textContent = playing ? "Pause" : "Play";
  // Resuming a live match rejoins the live edge rather than replaying from
  // wherever it was paused.
  following = live && playing;
});
document.getElementById("step").addEventListener("click", () => {
  playing = false;
  following = false;
  playEl.textContent = "Play";
  position = Math.min(position + 1, Math.max(frames.length - 1, 0));
  scrubEl.value = String(position);
});
document.getElementById("speed").addEventListener("change", (event) => {
  speed = parseFloat(event.target.value);
});
scrubEl.addEventListener("input", (event) => {
  position = Number(event.target.value);
  playing = false;
  following = false;
  playEl.textContent = "Play";
});
document.querySelectorAll("button[data-toggle]").forEach((button) => {
  button.addEventListener("click", () => {
    const key = button.dataset.toggle;
    show[key] = !show[key];
    button.classList.toggle("on", show[key]);
  });
});
window.addEventListener("keydown", (event) => {
  if (event.code === "Space") { event.preventDefault(); playEl.click(); }
  if (event.code === "ArrowRight") document.getElementById("step").click();
  if (event.code === "ArrowLeft") {
    playing = false; playEl.textContent = "Play";
    position = Math.max(position - 1, 0);
    scrubEl.value = String(position);
  }
  if (event.code === "Escape") select(null);
});

// Picking a player. The authoritative frame is hit-tested rather than the
// interpolated one: what is under the cursor is what the panel will report.
canvas.addEventListener("click", (event) => {
  const entry = frames[Math.min(Math.floor(position), frames.length - 1)];
  if (!entry) return;
  select(playerAt(fieldPoint(event.clientX, event.clientY), entry.frame));
});
document.getElementById("inspector-close")
  .addEventListener("click", () => select(null));
canvas.addEventListener("mousemove", (event) => {
  const entry = frames[Math.min(Math.floor(position), frames.length - 1)];
  const over = entry
    ? playerAt(fieldPoint(event.clientX, event.clientY), entry.frame) : null;
  canvas.style.cursor = over === null ? "" : "pointer";
});
window.addEventListener("resize", () => {
  resize();
  positionFloatingInspector();
});

// ---------------------------------------------------------------------------
// Sizing the pitch
//
// By default the pitch takes whatever the other panels leave it. That is the
// right answer until it is not: a docked player panel and a long event log can
// squeeze it on a laptop, and a tall window has height going spare. The grip
// under the pitch sets the height by hand, and the choice is remembered the
// way a window size would be — a viewer who wants a big pitch wants it for
// every replay they open, not just this one.
//
// The height belongs to the container, not to the drawing: the projection
// still fits the field to whatever room it is given, so the pitch keeps its
// proportions and everything drawn on it scales with the container.
// ---------------------------------------------------------------------------

/** Small enough to be a glance at the pitch, large enough to still be one. */
const PITCH_MIN_PX = 240;
const PITCH_STORE_KEY = "soccer-viewer:pitch-height";

const gripEl = document.getElementById("grip");
// The pitch height in pixels, or null for "fill whatever is left over".
let pitchHeight = null;
let gripDrag = null;

const clampPitch = (value) => Math.min(
  Math.max(value, PITCH_MIN_PX), Math.max(window.innerHeight * 3, PITCH_MIN_PX));

function applyPitchHeight(save = true) {
  if (pitchHeight === null) {
    document.body.style.removeProperty("--pitch-row");
    document.body.classList.remove("pitch-sized");
  } else {
    document.body.style.setProperty("--pitch-row", `${Math.round(pitchHeight)}px`);
    document.body.classList.add("pitch-sized");
  }
  // The canvas takes its size from the container, so it has to be re-read and
  // redrawn now rather than on the next frame — mid-drag, the next frame is
  // too late to be smooth.
  resize();
  positionFloatingInspector();
  render();
  if (!save) return;
  try {
    if (pitchHeight === null) localStorage.removeItem(PITCH_STORE_KEY);
    else localStorage.setItem(PITCH_STORE_KEY, String(Math.round(pitchHeight)));
  } catch (error) {
    // Storage is refused on some origins and in private windows. Not being
    // able to keep the setting between reloads is no reason to lose it now.
  }
}

/** Hands the height back to the layout. */
function fitPitch() {
  pitchHeight = null;
  applyPitchHeight();
}

function nudgePitch(delta) {
  pitchHeight = clampPitch((pitchHeight ?? stageEl.offsetHeight) + delta);
  applyPitchHeight();
}

/** Anything smaller than this is a tap that wandered, not a drag. */
const GRIP_SLOP_PX = 3;
// When the grip was last tapped without being dragged, for the double tap that
// resets the height. Detected here rather than left to a dblclick event: the
// grip captures the pointer for the duration of a drag, and a captured pointer
// does not reliably produce the compatibility mouse events a double-click is
// synthesised from — the reset simply never fired.
let lastGripTap = 0;

gripEl.addEventListener("pointerdown", (event) => {
  gripEl.setPointerCapture(event.pointerId);
  gripEl.classList.add("dragging");
  // Measured from where the pitch actually is, so taking hold of the grip
  // never jumps the height to some remembered value first. offsetHeight and
  // not clientHeight: the row height it becomes includes the container's
  // borders, and measuring without them walked the pitch 2px smaller on every
  // drag.
  gripDrag = { from: stageEl.offsetHeight, y: event.clientY };
});
gripEl.addEventListener("pointermove", (event) => {
  if (!gripDrag) return;
  pitchHeight = clampPitch(gripDrag.from + (event.clientY - gripDrag.y));
  applyPitchHeight(false);
});
const endGripDrag = (event) => {
  if (!gripDrag) return;
  const dragged = Math.abs(event.clientY - gripDrag.y) > GRIP_SLOP_PX;
  gripDrag = null;
  gripEl.classList.remove("dragging");
  if (dragged) {
    applyPitchHeight();
    lastGripTap = 0;
    return;
  }
  // A tap on its own changes nothing; a second one within the double-click
  // window hands the height back to the layout.
  const now = performance.now();
  if (now - lastGripTap < 400) {
    fitPitch();
    lastGripTap = 0;
  } else {
    lastGripTap = now;
  }
};
gripEl.addEventListener("pointerup", endGripDrag);
gripEl.addEventListener("pointercancel", endGripDrag);
gripEl.addEventListener("keydown", (event) => {
  const step = event.shiftKey ? 64 : 16;
  if (event.key === "ArrowDown") nudgePitch(step);
  else if (event.key === "ArrowUp") nudgePitch(-step);
  else if (event.key === "Home") fitPitch();
  else return;
  event.preventDefault();
});

// ---------------------------------------------------------------------------

resize();
try {
  const stored = Number(localStorage.getItem(PITCH_STORE_KEY));
  if (Number.isFinite(stored) && stored > 0) pitchHeight = clampPitch(stored);
} catch (error) {
  // No storage, no remembered height. The layout's own answer is a good one.
}
// ?pitch=N opens with the pitch that tall, the same way ?speed=N opens at a
// rate: a link can carry the shape of the view as well as the moment it shows.
// It is not saved — a link should not quietly redecorate the next replay.
if (params.get("pitch") !== null) {
  const requested = Number(params.get("pitch"));
  if (Number.isFinite(requested) && requested > 0) pitchHeight = clampPitch(requested);
}
applyPitchHeight(false);
drawLog();
// ?player=N opens with the inspector already following someone, the same way
// ?frame=N opens on a moment: between them a specific incident can be linked
// to — "player 3, tick 300" — rather than described.
if (params.get("player") !== null) {
  const requested = Number(params.get("player"));
  if (Number.isInteger(requested) && requested >= 0) select(requested);
}
if (params.get("live")) {
  live = true;
  statusEl.textContent = "live · waiting for the simulator";
  pollLive().catch(() => fail("could not reach the launcher"));
} else if (params.get("replay")) {
  loadReplay(params.get("replay")).catch(() => fail("could not load the replay"));
} else {
  fail("Nothing to show. Open this from the launcher, or add ?replay=NAME.");
}
requestAnimationFrame(tick);
</script>
</body>
</html>
