# Who this team is.
#
# The marker reads this file, and it is what puts your name next to your team
# on the leaderboard. Fill it in now — a submission without it is not marked.
#
# Check it at any time with:   START.cmd check      (or ./start.sh check)

[team]
# Shown on the leaderboard. 1-40 characters: letters, digits, spaces . _ ' & ( ) + -
name = "My Team"

# Bump this when you change your tactics, so you can tell your runs apart.
version = "1"

# Optional, up to 500 characters. A sentence on what your team tries to do.
# notes = "Holds possession and looks for a clear pass before shooting."


# One [[members]] block per person. Copy the whole block for a partner.
[[members]]
name = "Your Name"
student_number = "2412345"
